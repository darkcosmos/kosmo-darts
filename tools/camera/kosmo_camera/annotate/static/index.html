<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotation des captures</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Annotation des captures</h1>
    <button id="back" type="button" hidden></button>
    <span id="status" role="status" aria-live="polite"></span>
  </header>
  <main>
    <section id="screen-list">
      <h2 id="list-title"></h2>
      <ul id="sessions"></ul>
    </section>
    <section id="screen-session" hidden>
      <div id="banner" role="alert" hidden></div>
      <div class="layout">
        <div id="stage" aria-label="Photo à annoter">
          <img id="photo" alt="Photo de la fléchette">
          <canvas id="marks"></canvas>
          <canvas id="magnifier" width="160" height="160" hidden></canvas>
        </div>
        <aside id="panel">
          <div id="value" aria-live="polite"></div>
          <p id="entry"></p>
          <p id="state"></p>
          <p id="progress"></p>
          <p id="instruction"></p>
          <canvas id="diagram" width="280" height="280" aria-label="Schéma du cadran avec les quatre points de calibration"></canvas>
          <div class="actions" id="actions"></div>
          <div class="actions" id="recalibrate-actions"></div>
          <div class="actions" id="zoom-actions"></div>
          <div class="picker" id="picker"></div>
        </aside>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
