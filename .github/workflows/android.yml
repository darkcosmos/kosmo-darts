# Owner-maintained Android build. The agent cannot modify this file (token without 'workflow' scope).
# Same toolchain as the sandbox image (kosmo-agent-sandbox Dockerfile): keep both in sync.
name: android

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  CLT_BUILD: "15859902"
  CLT_SHA256: "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
  ANDROID_PLATFORM: "platforms;android-37.2"
  ANDROID_BUILD_TOOLS: "build-tools;37.0.0"
  # detekt: PRE-RELEASE by explicit owner exception (only 2.0.x supports Kotlin 2.4); move to 2.0.0 stable when published
  DETEKT_VERSION: "2.0.0-alpha.6"
  DETEKT_SHA256: "d46ca62ea4d62769b5d5c3ba94d49fa9b80ba11c7dba74ddb6df7fcc2c19c5fd"

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install pinned Android SDK packages (same as the sandbox)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP}/android-sdk"
          zip="commandlinetools-linux-${CLT_BUILD}_latest.zip"
          curl -fsSLo "${RUNNER_TEMP}/${zip}" "https://dl.google.com/android/repository/${zip}"
          echo "${CLT_SHA256}  ${RUNNER_TEMP}/${zip}" | sha256sum -c -
          mkdir -p "${sdk}/cmdline-tools"
          unzip -q "${RUNNER_TEMP}/${zip}" -d "${sdk}/cmdline-tools"
          mv "${sdk}/cmdline-tools/cmdline-tools" "${sdk}/cmdline-tools/latest"
          (yes || true) | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${sdk}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}" > /dev/null
          "${sdk}/cmdline-tools/latest/bin/sdkmanager" --list_installed
          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Generate the dependency graph in this read-only job; it is submitted by the submit-dependency-graph job below
          dependency-graph: generate-and-upload
          # Only what ships in the APK: build tooling (AGP and its deps) and tests are excluded
          dependency-graph-include-configurations: '^(releaseRuntimeClasspath|runtimeClasspath)$'

      - name: Build, unit tests, Android Lint, debug APK
        run: ./gradlew build :app:assembleDebug --stacktrace

      - name: The app must not request the INTERNET permission
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          perms="$("${ANDROID_HOME}/build-tools/37.0.0/aapt2" dump permissions "${apk}")"
          echo "${perms}"
          if echo "${perms}" | grep -q "android.permission.INTERNET"; then
            echo "::error::android.permission.INTERNET found in ${apk}"
            exit 1
          fi

      - name: Publish the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kosmo-darts-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish the screenshots (Roborazzi, record only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kosmo-darts-screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: error
          retention-days: 14

  detekt:
    name: detekt
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download detekt CLI (pinned, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          curl -fsSLo "${RUNNER_TEMP}/detekt-cli.jar" "${url}"
          echo "${DETEKT_SHA256}  ${RUNNER_TEMP}/detekt-cli.jar" | sha256sum -c -

      - name: detekt self-test (a known-bad snippet must be reported)
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/detekt-canary"
          mkdir -p "${dir}"
          cat > "${dir}/Canary.kt" <<'KT'
          package canary

          class Canary {
              fun empty() {}

              fun magic(): Int = 4242 * 17

              // TODO: forbidden comment canary
              fun unusedParameter(value: Int): Int = 1
          }
          KT
          java -jar "${RUNNER_TEMP}/detekt-cli.jar" \
            --input "${dir}" \
            --config .github/detekt/detekt.yml \
            --build-upon-default-config \
            --fail-on-severity Never \
            --report sarif:"${dir}/canary.sarif"
          found=$(jq '[.runs[].results[]] | length' "${dir}/canary.sarif")
          echo "detekt self-test findings: ${found}"
          jq -r '.runs[].results[] | "  \(.ruleId)"' "${dir}/canary.sarif"
          if [ "${found}" -lt 1 ]; then
            echo "::error::detekt self-test failed: the known-bad snippet produced no finding"
            exit 1
          fi

      - name: No new suppressions (detekt, Kotlin, Android Lint)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Exceptions are granted by the owner only, in the configuration under .github/, never in code.
          added=$(git diff --unified=0 "${BASE_SHA}...${HEAD_SHA}" -- '*.kt' '*.kts' '*.xml' \
            | grep -E '^\+[^+]' \
            | grep -E '@(file:)?Suppress(Warnings|Lint)?\b|tools:ignore=' || true)
          if [ -n "${added}" ]; then
            echo "::error::This PR adds warning suppressions. Fix the code, or ask the owner for a configuration exception."
            echo "${added}"
            exit 1
          fi
          echo "OK: no suppression added"

      - name: Run detekt with the owner configuration
        shell: bash
        run: |
          set -euo pipefail
          files=$(find app/src game-engine/src -name '*.kt' | wc -l)
          echo "Kotlin files to analyze: ${files}"
          if [ "${files}" -lt 1 ]; then
            echo "::error::no Kotlin file found to analyze"
            exit 1
          fi
          echo "KOTLIN_FILES=${files}" >> "${GITHUB_ENV}"
          # Blocking: any finding of severity 'error', or any tool error, fails the job.
          java -jar "${RUNNER_TEMP}/detekt-cli.jar" \
            --input app/src:game-engine/src \
            --config .github/detekt/detekt.yml \
            --build-upon-default-config \
            --base-path "${GITHUB_WORKSPACE}" \
            --report sarif:detekt.sarif

      - name: Publish detekt summary
        if: always()
        shell: bash
        run: |
          {
            echo "## detekt"
            echo "Kotlin files analyzed: ${KOTLIN_FILES:-unknown}"
            if [ -f detekt.sarif ]; then
              count=$(jq '[.runs[].results[]] | length' detekt.sarif)
              echo "Findings: ${count}"
              if [ "${count}" -gt 0 ]; then
                echo '```'
                jq -r '.runs[].results[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' detekt.sarif
                echo '```'
              fi
            else
              echo "No SARIF report produced (see the 'Run detekt' step log)."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload detekt results to code scanning
        if: always() && hashFiles('detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: detekt.sarif
          category: detekt

  # Submits the graph generated by 'build' in THIS run. Write access, but never checks out or runs code.
  submit-dependency-graph:
    name: submit-dependency-graph
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download and submit the dependency graph of this run
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    needs: submit-dependency-graph
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

