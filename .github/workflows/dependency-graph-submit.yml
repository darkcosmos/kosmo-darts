# Owner-maintained. Submits the Gradle dependency graph generated by the 'android' workflow.
# Security: this job has 'contents: write' but never checks out or executes repository code;
# it only downloads the graph artifact produced by the read-only build job and submits it.
name: dependency-graph-submit

on:
  workflow_run:
    workflows: [android]
    types: [completed]

permissions: {}

jobs:
  submit:
    name: submit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download and submit the dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit
