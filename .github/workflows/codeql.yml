# Owner-maintained. CodeQL for Kotlin/Java (Kotlin requires a real, observed build).
# Owner decision: runs on main after each merge, weekly, and on demand; NOT a pull request check.
# Toolchain values and the SDK step are copied from android.yml: keep both workflows in sync.
name: codeql

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  CLT_BUILD: "15859902"
  CLT_SHA256: "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
  ANDROID_PLATFORM: "platforms;android-37.2"
  ANDROID_BUILD_TOOLS: "build-tools;37.0.0"

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install pinned Android SDK packages (same as the sandbox)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP}/android-sdk"
          zip="commandlinetools-linux-${CLT_BUILD}_latest.zip"
          curl -fsSLo "${RUNNER_TEMP}/${zip}" "https://dl.google.com/android/repository/${zip}"
          echo "${CLT_SHA256}  ${RUNNER_TEMP}/${zip}" | sha256sum -c -
          mkdir -p "${sdk}/cmdline-tools"
          unzip -q "${RUNNER_TEMP}/${zip}" -d "${sdk}/cmdline-tools"
          mv "${sdk}/cmdline-tools/cmdline-tools" "${sdk}/cmdline-tools/latest"
          (yes || true) | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${sdk}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}" > /dev/null
          "${sdk}/cmdline-tools/latest/bin/sdkmanager" --list_installed
          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java-kotlin
          build-mode: manual
          # Broader security query suite (medium-precision rules included); CodeQL is non-blocking here
          queries: security-extended

      - name: Build observed by CodeQL (no cache, no daemon)
        run: ./gradlew assembleDebug --no-build-cache --no-configuration-cache --no-daemon --stacktrace

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:java-kotlin"
          output: codeql-results

      - name: Fail closed if CodeQL analyzed no code
        shell: bash
        run: |
          set -euo pipefail
          ls -l codeql-results
          loc=$(jq '[.runs[].properties.metricResults[]? | select(.ruleId | test("lines-of-code")) | .value] | add // 0' codeql-results/*.sarif)
          echo "CodeQL lines of code analyzed: ${loc}"
          echo "## CodeQL: ${loc} lines of code analyzed" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${loc}" -lt 1 ]; then
            echo "::error::CodeQL reported no analyzed code"
            exit 1
          fi
